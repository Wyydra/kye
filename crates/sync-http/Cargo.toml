[package]
name = "sync-http"
version = "0.1.0"
edition = "2024"
description = "HTTP & P2P sync server adapter for Kye"

[dependencies]
domain = { path = "../domain" }
storage-fs = { path = "../storage-fs" }
tiny_http = "0.12.0"
ureq = { version = "2.9.7", features = ["json"] }
qrcode = { version = "0.14.0", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
thiserror = "2.0.18"
tracing = "0.1"
