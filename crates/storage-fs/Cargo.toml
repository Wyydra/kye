[package]
name = "storage-fs"
version = "0.1.0"
edition = "2024"
description = "Filesystem & Markdown storage adapter for Kye"

[dependencies]
domain = { path = "../domain" }
thiserror = "2.0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
pulldown-cmark = "0.12.0"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.3.3"
notify = "8.2.0"
tracing = "0.1"
once_cell = "1"
smallvec = "1"
