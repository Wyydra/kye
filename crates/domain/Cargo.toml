[package]
name = "domain"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2.0.18"
uuid = { version = "1.22.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
indexmap = { version = "2", features = ["serde"] }
smallvec = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
