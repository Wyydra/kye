[tools]
rust = "stable"
bun = "latest"
java = "openjdk-17"
jj = "latest"

[env]
RUST_LOG = "info,kye=debug"

[tasks]
# --- Desktop GUI (Tauri + Bun) ---
gui-dev = { run = "cd crates/gui && bun install && bunx @tauri-apps/cli dev", description = "Launch desktop GUI in dev mode" }
gui-build = { run = "cd crates/gui && bun install && bunx @tauri-apps/cli build", description = "Build desktop GUI production package" }

# --- Headless CLI & Daemon ---
serve = { run = "cargo run -p kye-cli -- serve --workspace ./demo --port 7272", description = "Launch kye daemon server" }
info = { run = "cargo run -p kye-cli -- info", description = "Display local P2P sync network info" }
cli-build = { run = "cargo build -p kye-cli --release", description = "Build kye headless CLI binary" }

# --- Mobile (Android) ---
android-init = { run = "cd crates/gui && bun install && bunx @tauri-apps/cli android init", description = "Initialize Android project" }
android-dev = { run = "cd crates/gui && bun install && bunx @tauri-apps/cli android dev", description = "Run Android app in dev mode" }
android-run = { run = "cd crates/gui && bun install && bunx @tauri-apps/cli android run", description = "Install & run Android app" }
android-build = { run = "cd crates/gui && bun install && bunx @tauri-apps/cli android build --apk", description = "Build Android APK" }
android-uninstall = { run = "adb uninstall dev.wydry.kye || cmd /c exit 0", description = "Uninstall Android app from connected device" }

# --- Quality & Testing ---
fmt = { run = "cargo fmt --all && cd crates/gui && bun run build", description = "Format Rust & Frontend code" }
lint = { run = "cargo clippy --all-targets --all-features -- -D warnings && cd crates/gui && bun run build", description = "Run clippy and TS check" }
test = { run = "cargo test --workspace && cd crates/gui && bunx tsc --noEmit", description = "Run cargo tests and TS check" }
build-watch = { run = "RUST_LOG=debug cargo watch -x build", description = "Watch cargo build" }
check-watch = { run = "RUST_LOG=debug cargo watch -x check", description = "Watch cargo check" }

# --- Maintenance & Setup ---
setup-win = { run = "winget install --id Microsoft.VisualStudio.2022.BuildTools --override \"--passive --wait --add Microsoft.VisualStudio.Workload.VCTools --includeRecommended\" || cmd /c exit 0", description = "Install C++ Build Tools (link.exe) required for Rust MSVC on Windows" }
install = { run = "cd crates/gui && bun install", description = "Install node dependencies with bun" }
clean = { run = "cargo clean && rm -rf crates/gui/node_modules crates/gui/dist", description = "Clean build artifacts" }
